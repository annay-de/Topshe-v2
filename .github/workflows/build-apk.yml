name: Build Topshe APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Get sherpa-onnx native libraries (v2.0.2, open-source wake word + voice check)
        run: |
          curl -sSfL -o sherpa.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.2/sherpa-onnx-v2.0.2-android.tar.bz2
          tar xjf sherpa.tar.bz2
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp -v jniLibs/arm64-v8a/* android/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk topshe-v2-build-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: topshe-v2-build-${{ github.run_number }}
          path: topshe-v2-build-${{ github.run_number }}.apk

      - name: Publish as a release (download this on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Topshe build ${{ github.run_number }}
          files: topshe-v2-build-${{ github.run_number }}.apk
          make_latest: true
