name: Build Topshe APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Get sherpa-onnx native libraries (v2.0.2, open-source wake word + voice check)
        run: |
          curl -sSfL -o sherpa.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.2/sherpa-onnx-v2.0.2-android.tar.bz2
          tar xjf sherpa.tar.bz2
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp -v jniLibs/arm64-v8a/* android/app/src/main/jniLibs/arm64-v8a/

      - name: Check the in-app model download links still work
        continue-on-error: true
        run: |
          for u in \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34_LM.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx \
            https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip; do
            echo "LINKCHECK $(curl -sL -o /dev/null -w '%{http_code} %{size_download}' -r 0-0 "$u") $u"
          done
          curl -sL https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2 | tar tjf - | sed 's/^/KWSFILE /'

      - name: Unpack the permanent signing key (from repo Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/topshe.jks"
            echo "TOPSHE_KEYSTORE=$RUNNER_TEMP/topshe.jks" >> "$GITHUB_ENV"
            echo "Signing with the permanent Topshe key"
          else
            echo "::warning::No KEYSTORE_B64 secret - using a temporary key (updates won't install over old builds)"
          fi

      - name: Build APK
        working-directory: android
        env:
          TOPSHE_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk topshe-v2-build-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: topshe-v2-build-${{ github.run_number }}
          path: topshe-v2-build-${{ github.run_number }}.apk

      - name: Publish as a release (download this on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Topshe build ${{ github.run_number }}
          files: topshe-v2-build-${{ github.run_number }}.apk
          make_latest: true
