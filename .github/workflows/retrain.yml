name: Topshe weekly retrain

# Sunday 01:00 IST: start training on Kaggle with the week's phone data.
# Every 3 hours on Sunday/Monday (IST): check if training finished; test it; publish if it's better.
on:
  schedule:
    - cron: "30 19 * * 6"      # start   (Sat 19:30 UTC = Sun 01:00 IST)
    - cron: "15 */3 * * 0,1"   # collect
  workflow_dispatch:
    inputs:
      mode:
        description: "start or collect"
        required: true
        default: start

permissions:
  contents: write

concurrency:
  group: topshe-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the phone data (data branch)
        run: |
          git fetch origin data || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git worktree add databranch origin/data
            git -C databranch checkout -B data origin/data
          else
            git worktree add --orphan -b data databranch
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install -q --upgrade kaggle

      - name: Run
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "30 19 * * 6" ]; then MODE=start; else MODE=collect; fi
          fi
          echo "Mode: $MODE"
          python training/pipeline.py "$MODE"

      - name: Save status to the data branch
        if: always()
        run: |
          cd databranch
          git config user.name "topshe-bot"
          git config user.email "topshe-bot@users.noreply.github.com"
          git add -A retrain || true
          if ! git diff --cached --quiet; then
            git commit -m "retrain status $(date -u +%F_%H%M)"
            git pull --rebase origin data || true
            git push origin data
          fi
