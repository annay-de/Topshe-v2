name: Build the hearing pool (English + Bengali)

# Speaks ~3,000 made-up training commands with Indian voices and records what BOTH phone speech
# models hear (training/build_hearing_pool.py). Saved to data/hearing_pool.jsonl in the data branch,
# where every weekly retrain picks it up.
on:
  workflow_dispatch:
    inputs:
      n_en:
        description: "English commands"
        default: "1500"
      n_bn:
        description: "Bengali / Banglish commands"
        default: "1500"

permissions:
  contents: write

jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -q "sherpa-onnx==2.0.2" edge-tts soundfile numpy
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
      - name: Download the two speech models (same as the phone)
        run: |
          mkdir -p models && cd models
          for m in sherpa-onnx-whisper-base sherpa-onnx-streaming-zipformer-bn-vosk-2026-02-09; do
            curl -sSfL "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$m.tar.bz2" | tar xjf -
          done
      - name: Speak and hear
        run: python training/build_hearing_pool.py models pool/hearing_pool.jsonl "${{ github.event.inputs.n_en }}" "${{ github.event.inputs.n_bn }}"
      - name: Save to the data branch
        run: |
          git fetch origin data
          git worktree add databranch origin/data
          cd databranch
          git checkout -B data origin/data
          mkdir -p data
          cp ../pool/hearing_pool.jsonl data/hearing_pool.jsonl
          git config user.name "topshe-bot"
          git config user.email "topshe-bot@users.noreply.github.com"
          git add data/hearing_pool.jsonl
          git commit -m "hearing pool ($(wc -l < data/hearing_pool.jsonl) commands)" || echo "no change"
          git pull --rebase origin data || true
          git push origin data
